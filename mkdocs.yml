# Replace every __TOKEN__ and every TODO; keep the structure.

site_name: Stepper-C
site_description: >-
  TODO one sentence: hardware-agnostic Stepper Motor Control library in C for embedded systems:
  no heap, no RTOS, MISRA C:2012, 100 % test coverage.
site_author: Anton Vynohradov
site_url: https://antonvynohradov.github.io/Stepper-C/   # GitHub Pages path = repository name
repo_url: https://github.com/AntonVynohradov/Stepper-C
repo_name: AntonVynohradov/Stepper-C
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
