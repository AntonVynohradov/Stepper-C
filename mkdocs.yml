# MkDocs configuration of Stepper-C (SystemFromScratch® library layout).

site_name: Stepper-C
site_description: >-
  Closed-loop microstepping current control for two-phase stepper motors in portable C11
  for any MCU: no heap, no RTOS, MISRA C:2012, 100 % test coverage.
site_author: Anton Vynohradov
site_url: https://antonvynohradov.github.io/Stepper-C/   # GitHub Pages path = repository name
repo_url: https://github.com/AntonVynohradov/Stepper-C
repo_name: AntonVynohradov/Stepper-C
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Getting Started: guide.md
      - How It Works: architecture.md
      - Using the Library: usage.md
      - Extending the Library: extending.md
      - Configuration: configuration.md
  - Motor Control: motor-control.md
  - Protection: protection.md
  - Integration: integration.md
  - Reference:
      - API Reference: api.md
      - Doxygen:
          - Modules: reference/modules.md
          - Files: reference/files.md
          - Data Structures: reference/annotated.md
          - Functions: reference/functions.md
          - Macros: reference/macros.md
      - MISRA C:2012: misra.md
      - Changelog: changelog.md
  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  generator: false
  # Header download button (overrides/partials/header.html); the PDF is built by CI
  manual_pdf: downloads/Stepper-C_User_Manual.pdf
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0005-6965-0911
      name: Anton Vynohradov on ORCID
    - icon: material/web
      link: https://systemfromscratch.com
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html. Story: hero -> the problem (3 problem->solution
  # cards) -> what you get (6 linked cards) -> measured stats -> quick start
  # (docs/index.md) -> SystemFromScratch® portfolio banner. See references/website.md.
  landing:
    eyebrow: Open-source embedded library
    title: Stepper Motor Control                      # first hero line (uppercase via CSS)
    accent: in portable C                    # second hero line, accent color
    lead: >-
      Stepper-C turns phase-current measurements and motion commands into PWM duty cycles
      for two-phase stepper motors: closed-loop microstepping current control on any MCU,
      with no heap, no RTOS and code that passes MISRA C:2012.
    hero_image: assets/images/hero-dark.png
    hero_alt: >-
      A controller board whose microcontroller runs Stepper-C drives a stepper motor
      through its power transistors; the two phase currents are drawn as sine waves.
    buttons:
      - {text: Get started, link: guide/, style: primary}
      - {text: View on GitHub, link: "https://github.com/AntonVynohradov/Stepper-C", style: outline}
    features:
      - {icon: chip, line1: No heap, line2: No RTOS}
      - {icon: shield, line1: MISRA C:2012, line2: 0 violations}
      - {icon: flask, line1: 100 % line &, line2: branch coverage}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: Smooth, quiet and exact, on a small MCU
      intro: >-
        A stepper driver chip hides the current control in silicon. When you build the
        power stage yourself (an MCU with gate drivers, a three-leg ESC board, a custom
        H-bridge) the firmware has to regulate two phase currents at the PWM rate, keep
        the position exact over millions of microsteps, stay inside the voltage the
        bridge can apply and switch off within one period on a fault, often on a core
        without an FPU.
      cards:
        - icon: wave
          title: Currents that follow the angle at 20 kHz
          text: >-
            Smooth, quiet motion without hand-tuning: one PI controller per phase with
            gains derived from R, L and one bandwidth value, back-EMF feed-forward and
            anti-windup. On the motor model a 2 A step settles in 0.40 ms with 1.1 %
            overshoot.
          tags: [PI + feed-forward, Anti-windup, Bus compensation]
        - icon: memory
          title: Tight embedded budgets
          text: >-
            Fits next to your application on a small MCU: 496 B of RAM per motor, 216 B
            worst-case stack in the PWM interrupt, 10.8 KiB of flash on Cortex-M4. A
            fixed-point backend for cores without FPU; no allocation, no globals, no OS.
          tags: [Q15 or float, Static memory, Bare metal & RTOS]
        - icon: shield
          title: Code built for certification
          text: >-
            Zero MISRA C:2012 violations, a documented deviation register, 100 % line
            and branch coverage in every build variant, bounded execution time and
            static analysis in CI: evidence for your safety case.
          tags: [MISRA C, Cppcheck, CodeQL]
    offer:
      eyebrow: What you get
      title: One library from motion command to PWM
      intro: >-
        16 public functions, six modules (control, self-test, stall detection, motion,
        power stage, numeric backend), two power stage topologies and two numeric
        backends, verified in closed loop on a motor model and running on a
        B-G431B-ESC1 board.
      cards:
        - {icon: wave, title: Current control and microstepping, text: "PI per phase with feed-forward, sine/cosine references from a 32-bit electrical angle, 1 to 256 microsteps.", tags: [PI, Sine table, Microsteps], link: motor-control/}
        - {icon: gauge, title: Motion planner, text: "Trapezoidal moves without overshoot, constant-velocity runs, smooth stop and retargeting, exact integer positions.", tags: [Trapezoid, Q16 positions], link: "motor-control/#motion-profile"}
        - {icon: plug, title: Any power stage, text: "Two H-bridges or three half-bridges with a shared leg; the voltage limit keeps the direction; the bus voltage is compensated.", tags: [4 legs, 3 legs, B-G431B-ESC1], link: integration/}
        - {icon: lock, title: Protection and stall detection, text: "A self-test finds a short, an open phase or miswiring before the motor turns. Overcurrent and bus voltage trips switch the outputs off within the same PWM period; a back-EMF observer reports a stalled rotor without a sensor.", tags: [Self-test, Trips, Stall detection], link: protection/}
        - {icon: document, title: Complete documentation, text: "Guides, the control theory with measured results, the integration guide and a full API reference, also as a PDF.", tags: [API, Guides, PDF], link: api/}
        - {icon: check, title: Evidence you can inspect, text: "Every release ships its MISRA C:2012 report and the PDF manual; unit and closed-loop tests with a 100 % coverage gate, MISRA, Cppcheck and CodeQL run in CI on every change.", tags: [MISRA report, Coverage, CI], link: misra/}
    stats:                                   # measured values only
      - {value: "16", label: public functions}
      - {value: "496 B", label: RAM per motor}
      - {value: "216 B", label: stack in the PWM interrupt}
      - {value: "0", label: MISRA C:2012 violations}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        Stepper-C is developed by Anton Vynohradov under SystemFromScratch® — secure
        embedded systems and compliance-ready engineering, from concept to
        certification-ready product.
      buttons:
        - {text: Ask for a short call, link: "https://systemfromscratch.com", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. STM32 is a registered trademark of
      STMicroelectronics International N.V.; Stepper-C is not affiliated with or endorsed
      by STMicroelectronics.

  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py. See references/pdf-manual.md.
  manual:
    title: Stepper-C
    subtitle: Stepper Motor Control Library for Embedded Systems
    version_header: sstep.h
    version_macro: SSTEP_VERSION
    output: build/manual/Stepper-C_User_Manual_v{version}.pdf
    eyebrow: Open-source embedded library
    cover_image: assets/images/hero-dark.png
    appendices: [changelog.md, LICENSE.md]
    unnumbered: [about.md]
    web_only: [index.md, reference/]
    keywords: stepper motor, microstepping, current control, embedded, C, MISRA C:2012
    vendor_trademarks: >-
      STM32 is a registered trademark of STMicroelectronics International N.V. Motor and
      board names are used only as examples of hardware the library can drive; Stepper-C
      is not affiliated with or endorsed by STMicroelectronics or any motor manufacturer.

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - assets/javascripts/katex.js
  - https://unpkg.com/katex@0.16.9/dist/katex.min.js
  - https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js

plugins:
  - search
  - autorefs
  - mkdoxy:
      projects:
        reference:
          src-dirs: sstep.h inc src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.c *.h"
            RECURSIVE: True
            EXTRACT_STATIC: True
            JAVADOC_AUTOBRIEF: True

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
