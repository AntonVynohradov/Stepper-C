nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Getting Started: guide.md
      - How It Works: architecture.md
      - Using the Library: usage.md
      - Extending the Library: extending.md
      - Configuration: configuration.md
  - Protocol: protocol.md
  - Integration:
      - Integration Guide: integration.md
      - Examples: examples.md
      # - __TOOL__: gui.md            # only if the project has a desktop tool
  - Reference:
      - API Reference: api.md
      - Doxygen:
          - Modules: reference/modules.md
          - Files: reference/files.md
          - Data Structures: reference/annotated.md
          - Functions: reference/functions.md
          - Macros: reference/macros.md
      - MISRA C:2012: misra.md
      - Changelog: changelog.md
  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

