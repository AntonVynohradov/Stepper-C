<text x="460.0" y="112" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#2E7D32" text-anchor="middle">HOLDING</text>
<rect x="660" y="160" width="200" height="70" rx="35" fill="#E6F4F5" stroke="#0F8B9A" stroke-width="2"/>
<text x="760.0" y="192" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">SSTEP_STATE_</text>
<text x="760.0" y="212" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="bold" fill="#0F8B9A" text-anchor="middle">MOVING</text>
