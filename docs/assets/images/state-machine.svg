<text x="460" y="395" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">Faults: overcurrent, over/undervoltage, callback error, sstep_report_fault(). Outputs go off at once.</text>
