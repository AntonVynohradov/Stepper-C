name: Build Static Library

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure (Release preset)
        run: cmake --preset "SSTEP[Release]" -B "build/SSTEP[Release]"

      - name: Build
        run: cmake --build "build/SSTEP[Release]"

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: sstep-static-lib
          path: build/SSTEP\[Release\]/libsstep.a
