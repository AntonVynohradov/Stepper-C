#******************************************************************************
# Stepper-C: Stepper Motor Control Implementation
#
# Project:     Stepper-C - Hardware-Agnostic Stepper Motor Control Library
# Description: Release on a vX.Y.Z tag: check the version, run every quality
#              gate, publish the static library, headers, MISRA report and PDF
#              user manual as a GitHub Release.
#
# Author:      Anton Vynohradov
# Email:       avynohradov@systemfromscratch.com
#
# License:     Apache License 2.0
# Copyright (c) 2026 Anton Vynohradov
#
# SPDX-License-Identifier: Apache-2.0
#*****************************************************************************

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -q "set(SSTEP_DEFAULT_VERSION \"$VERSION\")" cmake/version.cmake \
            || { echo "cmake/version.cmake: SSTEP_DEFAULT_VERSION is not $VERSION"; exit 1; }
          grep -q "#define SSTEP_VERSION \"$VERSION\"" sstep.h \
            || { echo "sstep.h: SSTEP_VERSION is not $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev gcovr cppcheck libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -r requirements-dev.txt

      # every configure preset with [UnitTests in its name, as in google-unit-tests.yml
      - name: Unit tests and coverage gate (every unit test preset)
        run: |
          for P in $(jq -r '.configurePresets[].name | select(contains("[UnitTests"))' CMakePresets.json); do
            cmake --preset "$P" -B "build/$P"
            cmake --build "build/$P" --target coverage
          done

      - name: MISRA C:2012 gate
        run: |
          cmake --preset "SSTEP[Debug]" -B "build/SSTEP[Debug]"
          cmake --build "build/SSTEP[Debug]" --target misra-analyze

      - name: Build release library
        run: |
          cmake --preset "SSTEP[Release]" -B "build/SSTEP[Release]"
          cmake --build "build/SSTEP[Release]"

      - name: Package
        run: |
          PKG="stepper-c-$VERSION-linux-x86_64"
          mkdir -p "$PKG/lib" "$PKG/include"
          cp "build/SSTEP[Release]/libsstep.a" "$PKG/lib/"
          cp sstep.h inc/*.h "$PKG/include/"
          cp LICENSE README.md CHANGELOG.md "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"
          cp "build/SSTEP[Debug]/misra.txt" "stepper-c-$VERSION-misra.txt"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: PDF manual
        run: python tools/docs/build_manual.py --output "stepper-c-$VERSION-user-manual.pdf"

      - name: Release notes from CHANGELOG
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || index($0, "[Unreleased]:") == 1) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Stepper-C $VERSION" \
            --notes-file release-notes.md \
            "$PKG.tar.gz" "stepper-c-$VERSION-misra.txt" "stepper-c-$VERSION-user-manual.pdf"
