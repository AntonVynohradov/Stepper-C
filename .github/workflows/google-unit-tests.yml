name: Google Unit Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.preset }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [UnitTests, UnitTestsFloat]   # fixed point and float backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google Test and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev gcovr

      - name: Configure
        run: cmake --preset "[${{ matrix.preset }}]Stepper Motor Control" -B "build/[${{ matrix.preset }}]Stepper Motor Control"

      - name: Build, test and coverage gate
        run: cmake --build "build/[${{ matrix.preset }}]Stepper Motor Control" --target coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.preset }}
          path: build/\[${{ matrix.preset }}\]Stepper Motor Control/Coverage
