name: Check Building Static Library

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure (Debug preset)
        run: cmake --preset "SSTEP[Debug]" -B "build/SSTEP[Debug]"

      - name: Build
        run: cmake --build "build/SSTEP[Debug]"

      - name: Configure (Release preset)
        run: cmake --preset "SSTEP[Release]" -B "build/SSTEP[Release]"

      - name: Build
        run: cmake --build "build/SSTEP[Release]"
